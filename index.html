<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>全場灌籃 Full Court Slam</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0f1a;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  #stick {
    position: absolute; left: 4vw; bottom: 6vh; width: 150px; height: 150px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25); pointer-events: auto;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%; background: rgba(255,255,255,.35);
  }
  #btns {
    position: absolute; right: 3vw; bottom: 5vh; width: 240px; height: 210px; pointer-events: none;
  }
  #btns button {
    position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255,255,255,.4);
    color: #fff; font: 700 15px/1.1 inherit; font-family: inherit; background: rgba(255,255,255,.12);
    -webkit-tap-highlight-color: transparent;
  }
  #btns button small { font-size: 10px; opacity: .8; font-weight: 400; }
  #btns button.down { background: rgba(255,255,255,.35); }
  #btns button.on { background: rgba(255,213,74,.75); color: #1a1200; border-color: #ffd54a; }
  #touch, #touch * { -webkit-touch-callout: none; touch-action: none; }
  #knob.fast { background: rgba(255,213,74,.8); }
  #btns [data-act=shoot]  { right: 0;    bottom: 0;    width: 104px; height: 104px; background: rgba(232,69,44,.45); }
  #btns [data-act=pass]   { right: 120px; bottom: 8px;  width: 80px;  height: 80px;  background: rgba(43,125,233,.45); }
  #btns [data-act=sprint] { right: 16px;  bottom: 122px; width: 72px;  height: 72px; }
  #btns [data-act=jump]   { right: 112px; bottom: 104px; width: 70px;  height: 70px; background: rgba(60,190,110,.45); }
  #btns [data-act=pause]  { right: 200px; bottom: 150px; width: 46px;  height: 46px; font-size: 13px; }
  #lobby {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,7,14,.6); z-index: 10;
  }
  #lobby[hidden] { display: none; }
  #lobby .card {
    width: min(440px, calc(100vw - 32px)); box-sizing: border-box; padding: 22px 22px 18px; border-radius: 16px;
    background: #10162a; border: 1px solid rgba(255,255,255,.14); color: #e8ecf5; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #lobby h2 { margin: 0 0 12px; font-size: 22px; color: #ffd54a; }
  #lobby p { margin: 8px 0; font-size: 14px; color: #9fb0d0; }
  #lobby .code { font: 800 44px/1.1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 8px; color: #fff; margin: 4px 0 10px; }
  #lobby .row { display: flex; gap: 8px; }
  #lobby input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: #0b0f1a; color: #fff; font: 600 15px/1.2 inherit; font-family: inherit;
  }
  #joinCode { text-transform: uppercase; letter-spacing: 4px; font-size: 20px !important; text-align: center; }
  #lobby button {
    padding: 10px 16px; border-radius: 10px; border: 0; background: #ffd54a; color: #1a1200;
    font: 800 15px/1.2 inherit; font-family: inherit; cursor: pointer;
  }
  #lobby button.ghost { background: rgba(255,255,255,.1); color: #fff; margin-top: 12px; width: 100%; }
  #lobby .status { min-height: 20px; color: #c7ff7a; }
  #lobby .status.err { color: #ff8a7a; }
  /* 連線聊天（和 tennis 相同的設計） */
  #chat {
    position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); width: min(380px, calc(100vw - 20px));
    z-index: 11; pointer-events: none; display: flex; flex-direction: column; color: #fff; font-size: 14px;
  }
  #chat.hidden { display: none; }
  #touch.on ~ #chat { width: clamp(200px, calc(100vw - 430px), 340px); }
  #chatLog .m {
    width: fit-content; max-width: 100%; margin-bottom: 4px; padding: 4px 9px; border-radius: 9px;
    background: rgba(8,12,22,.75); line-height: 1.4; word-break: break-word; transition: opacity .8s;
  }
  #chatLog .m.old { opacity: 0; }
  #chat.open #chatLog .m.old { opacity: .85; }
  #chatBar {
    pointer-events: auto; background: rgba(8,12,22,.6); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; padding: 5px; margin-top: 2px;
  }
  #chat.open #chatBar { background: rgba(8,12,22,.9); }
  #chatQuick { display: none; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  #chat.open #chatQuick { display: flex; }
  #chat button {
    font-family: inherit; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08);
  }
  #chatQuick button { padding: 5px 9px; font-size: 14px; border-radius: 999px; }
  #chatRow { display: flex; gap: 6px; }
  #chatIn {
    flex: 1; min-width: 0; padding: 6px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.3); color: #fff; font: 15px/1.3 inherit; font-family: inherit;
    user-select: text; -webkit-user-select: text;
  }
  #chatRow button { padding: 6px 12px; border-radius: 9px; background: #ffd54a; color: #1a1200; border: none; font-weight: 700; }
  #chatRow button.vbtn { padding: 6px 9px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); font-size: 15px; }
  #chatRow button.vbtn[hidden] { display: none; }
  #micBtn.on { background: #3ec46d; border-color: #5dff7a; box-shadow: 0 0 10px rgba(93,255,122,.6); }
  #micBtn.wait { opacity: .6; }
  #spkBtn.off { background: rgba(255,90,70,.35); }
  #chatLog .m.sys { color: #c9d4ea; font-style: italic; }
  #rotate {
    position: fixed; left: 0; right: 0; top: 12px; text-align: center; color: #ffd54a; font-size: 14px;
    pointer-events: none; display: none;
  }
  @media (max-height: 500px) {
    #btns { transform: scale(.78); transform-origin: bottom right; }
    #stick { width: 120px; height: 120px; }
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
</head>
<body>
<canvas id="c" aria-label="全場灌籃籃球遊戲"></canvas>

<div id="lobby" hidden>
  <div class="card" role="dialog" aria-label="連線對戰">
    <h2>連線對戰</h2>
    <div id="lobbyHost" hidden>
      <p>房間代碼</p>
      <div class="code" id="roomCode">·····</div>
      <p>把代碼或這個連結傳給朋友：</p>
      <div class="row"><input id="roomLink" readonly aria-label="邀請連結"><button id="copyLink">複製連結</button></div>
    </div>
    <div id="lobbyJoin" hidden>
      <p>輸入朋友給你的 5 碼房間代碼</p>
      <div class="row"><input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AB3CD" aria-label="房間代碼"><button id="joinBtn">加入</button></div>
    </div>
    <p id="lobbyStatus" class="status"></p>
    <button id="lobbyCancel" class="ghost">取消</button>
  </div>
</div>
<div id="rotate">📱 請將手機橫放，遊戲畫面更大</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button data-act="pause">II</button>
    <button data-act="jump">跳<br><small>籃板 / 蓋帽</small></button>
    <button data-act="sprint">衝刺</button>
    <button data-act="pass">傳球<br><small>換人</small></button>
    <button data-act="shoot">投籃<br><small>灌籃 / 抄截</small></button>
  </div>
</div>

<div id="chat" class="hidden">
  <div id="chatLog" aria-live="polite"></div>
  <div id="chatBar">
    <div id="chatQuick"><button>👍 好球！</button><button>😂</button><button>😱 好險</button><button>🔥</button><button>再來一場！</button><button>GG</button></div>
    <div id="chatRow"><input id="chatIn" maxlength="60" placeholder="💬 打字聊天，Enter 送出" autocomplete="off" enterkeyhint="send" aria-label="聊天訊息"><button id="micBtn" class="vbtn" title="開啟麥克風和對手講話" aria-label="麥克風">🎤</button><button id="spkBtn" class="vbtn" title="對手的聲音" aria-label="對手聲音" hidden>🔊</button><button id="chatSend">送出</button></div>
  </div>
</div>
<audio id="voiceOut" autoplay playsinline></audio>
<script src="game.js"></script>
</body>
</html>
